spring:
  application:
    name: ai-doc-analyzer

  # Lee el .env de la raíz del proyecto (si no existe, no falla)
  config:
    import: optional:file:.env[.properties]

  # ---------- Carga de archivos ----------
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  # ---------- Base de datos (Docker, puerto 5433) ----------
  datasource:
    url: jdbc:postgresql://localhost:5433/aidoc
    username: aidoc
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate      # Flyway crea las tablas; Hibernate solo verifica
    open-in-view: false

  # ---------- Paginación ----------
  data:
    web:
      pageable:
        max-page-size: 100    # nadie puede pedir más de 100 por página

  # ---------- IA ----------
  ai:
    model:
      chat: openai            # el chat lo hace Groq (API compatible con OpenAI)
      embedding: ollama       # los embeddings se hacen en local

    openai:                   # configuración de Groq
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        model: qwen/qwen3.8-27b
        temperature: 0.2

    ollama:
      base-url: http://localhost:11434
      embedding:
        model: nomic-embed-text

    vectorstore:
      pgvector:
        initialize-schema: false   # vector_store la crea Flyway (V4)
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE

# ---------- Configuración propia de la aplicación ----------
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
  storage:
    location: ./storage
  ingestion:
    chunk-size: 500
  search:
    top-k: 5
    similarity-threshold: 0.0
  embedding:
    document-prefix: "search_document: "
    query-prefix: "search_query: "