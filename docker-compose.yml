services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aidoc-postgres
    environment:
      POSTGRES_DB: aidoc
      POSTGRES_USER: aidoc
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidoc -d aidoc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: